# Frozen data specification. Changing anything here invalidates all cached
# results; bump `version` and re-run end to end if you must.
#
# Version 2: substituted the credit spread series (BAMLH0A0HYM2 -> BAA10Y).
# Split dates, target, lookback and scaling are unchanged from version 1.
version: 2

universe:
  source: sp500bench.data.universe.TICKERS
  size: 50
  index_proxy: "^GSPC"        # regime labelling only, never a feature

calendar:
  start: "2005-01-01"
  end: "2026-08-25"

splits:
  train: {start: "2005-01-01", end: "2016-12-31"}
  val:   {start: "2017-01-01", end: "2019-12-31"}
  test:  {start: "2020-01-01", end: "2026-08-25"}
  # Foundation models were pre-trained on public market data. The slice below is
  # the only stretch guaranteed to post-date every checkpoint we evaluate, and
  # carries the contamination-free comparison.
  test_clean_slice: {start: "2025-09-01", end: "2026-08-25"}

target:
  kind: log_return
  horizon: 1
  lookback: 60

macro:
  provider: fred
  # BAA10Y replaces BAMLH0A0HYM2: FRED serves the ICE BofA series on a rolling
  # ~3-year window, leaving it empty across train and validation. See Limitations.
  series: [VIXCLS, DGS10, DGS2, T10Y2Y, DFF, BAA10Y, CPIAUCSL, UNRATE, INDPRO]
  enforce_release_lag: true

scaling:
  method: standard
  scope: per_ticker
  fit_on: train_only
