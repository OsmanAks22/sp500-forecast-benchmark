# Twenty models across four generations, plus the volatility arm.
# Nine come from the approved proposal; eleven are additions that close the gap
# to the 2026 literature.
#
# This file must agree with src/sp500bench/models/registry.py, which is the
# executable source of truth. Version 2 resynced Tier 3 to the second-generation
# foundation checkpoints and added the HAR volatility arm, both of which the
# registry already carried. Version 3 adds TTM to Tier 3 and GJR-GARCH to the
# volatility arm - both pre-registered, both locked before any model was run.
# Version 4 aligns training.quantiles to the densified evaluation grid.
# Version 5 splits the Tier 0 baseline in two. What was called Naive was
# statsforecast's Naive - tomorrow's return equals today's - which is not the
# random walk on prices and is not what H1 is written against. ZeroReturn is the
# correct benchmark and is now the H1 reference; the old model is kept, renamed
# LastReturn, as an informative baseline.
# Version 6 marks Moirai-2.0 excluded. The roster is still twenty specs; nineteen
# are runnable. The entry is kept rather than deleted so the pre-registration
# record shows a model that was specified, attempted and excluded for a stated
# environmental reason, rather than one that simply is not there.
version: 6

tier_0_baselines:
  # The H1 reference. Random walk on prices => zero forecast return. Its RMSE is
  # the sample standard deviation of test returns by construction.
  - {name: ZeroReturn,          lib: sp500bench,    cost: negligible}
  # ADDED. statsforecast's Naive, renamed for what it is: y[t+1] = y[t] on a
  # return series. It differences an already-differenced series, so its RMSE is
  # sqrt(2(1-rho)) ~ 1.45x ZeroReturn's on this panel. Informative, not the
  # reference - scoring against it inflates every other model by ~30%.
  - {name: LastReturn,          lib: statsforecast, cost: negligible}
  - {name: RandomWalkWithDrift, lib: statsforecast, cost: negligible}

tier_1_statistical:            # proposal
  - {name: AutoARIMA, lib: statsforecast, refit: per_fold, cost: cpu_hours}
  - {name: AutoETS,   lib: statsforecast, refit: per_fold, cost: cpu_minutes}

tier_2_linear:                 # ADDED - Zeng et al. (2023) is cited in the
  - {name: DLinear, lib: neuralforecast, cost: gpu_minutes}   # proposal; its
  - {name: NLinear, lib: neuralforecast, cost: gpu_minutes}   # model must be in

tier_2_recurrent:              # proposal
  - {name: LSTM, lib: neuralforecast, global: true, cost: gpu_hours}
  - {name: GRU,  lib: neuralforecast, global: true, cost: gpu_hours}

tier_2_transformer:            # proposal
  - {name: PatchTST, lib: neuralforecast, global: true, cost: gpu_hours}
  - {name: TFT,      lib: neuralforecast, global: true, cost: gpu_hours}
  - {name: TimesNet, lib: neuralforecast, global: true, cost: gpu_hours}

# ADDED - zero-shot, inference only. Second-generation checkpoints: the
# 2024-era models they replace (Chronos-Bolt and its contemporaries) are one
# generation behind as of August 2026.
#
# Only Kronos documents a pre-training cutoff. For the other four the cutoff is
# undocumented, which is itself reportable: without it no zero-shot comparison
# on recent data can be certified contamination-free. See the clean slice in
# configs/data.yaml.
tier_3_foundation:
  - name: Chronos-2
    lib: chronos
    checkpoint: amazon/chronos-2
    mode: zero_shot
    pretrain_cutoff: undocumented
    note: "Current SOTA generic TSFM; native quantile + covariate support."
  - name: TimesFM-2.5
    lib: timesfm
    checkpoint: google/timesfm-2.5-200m-pytorch
    entry_point: timesfm.TimesFM_2p5_200M_torch
    entry_point_superseded: timesfm.TimesFM3Forecaster
    inference_method: forecast
    inference_method_superseded: predict_batch
    requires_compile: true
    checkpoint_must_be_explicit: true
    checkpoint_library_default: google/timesfm-3.0-pytorch
    channel_layout: "10 channels, offset 1, median verified"
    channel_layout_superseded: "9 channels, offset 0"
    mode: zero_shot
    pretrain_cutoff: undocumented
    note: "Decoder-only, patch-based. CORRECTED 6 September 2026 after the first
           run of this spec produced invalid forecasts. TimesFM3Forecaster is the
           3.0 wrapper: it builds a TimesFM3Torch from this checkpoint's own
           config.json, of whose keys exactly one - quantiles - is also a
           TimesFM3Torch constructor argument, so every other architecture field
           was dropped, the model was built at 3.0 defaults, and the 2.5 weights
           had nowhere to land. The run completed without error and every
           assertion in the adapter passed, including the layout resolver, which
           verifies the median channel against the library's own point forecast -
           both came from the same unloaded network and agreed perfectly. The
           only signal was magnitude: a median of +2.45%/day against a realised
           +0.03%, and 144% implied annualised volatility against a realised 29%.
           The correct class is TimesFM_2p5_200M_torch, whose own DEFAULT_REPO_ID
           is this checkpoint; compile() is mandatory before forecast(), which
           returns a (point, quantiles) tuple with 10 channels, offset 1."
  # EXCLUDED 5 September 2026, after the Kaggle smoke test and before any result.
  # The spec stays here deliberately: it was pre-registered, it was attempted,
  # and it was excluded for a documented environmental reason. A model that
  # vanishes between the protocol and the results is indistinguishable, from the
  # outside, from one dropped because its numbers were inconvenient.
  - name: Moirai-2.0
    lib: uni2ts
    checkpoint: Salesforce/moirai-2.0-R-small
    mode: zero_shot
    pretrain_cutoff: undocumented
    status: excluded
    excluded_reason: "uni2ts pins numpy~=1.26.0; the Kaggle image ships 2.0.2"
    note: "Decoder-only with multi-token prediction; top GIFT-Eval ranking.
           NOT RUNNABLE. Resolved in its own pip transaction, uni2ts 2.0.0,
           1.2.0 and 1.1.1 all depend on numpy~=1.26.0 against the image's numpy
           2.0.2, so no available version installs. Downgrading numpy breaks
           pandas' C extension and every other model with it, so the pins were
           not widened. Reported in Limitations as a reproducibility finding
           about the TSFM ecosystem."
  - name: Kronos-small
    lib: kronos
    checkpoint: NeoQuasar/Kronos-small
    tokenizer: NeoQuasar/Kronos-Tokenizer-base
    mode: zero_shot
    native_input: ohlcv
    pretrain_cutoff: "2024-06"
    context_limit: 512
    note: "Domain-specific TSFM, AAAI 2026. Separate API - budget integration
           time. Autoregressive sampling, so CRPS comes from sampled paths, not
           a closed-form quantile head."
  - name: TTM
    lib: granite-tsfm
    checkpoint: ibm-granite/granite-timeseries-ttm-r2
    mode: zero_shot
    pretrain_cutoff: undocumented
    note: "TinyTimeMixers (IBM Granite), sub-1M-parameter MLP-Mixer. Direct
           replication probe: Brini (2026) reports TTM as the only TSFM to beat
           Log-HAR at every horizon, by 1.3-1.8%. A failure to reproduce that
           margin is itself the finding."

# Volatility arm only. HAR is the field-standard comparator; a volatility claim
# made without it is indefensible. Implemented in-package rather than pulled
# from a library - three regressors are easier to defend than a wrapper.
volatility_arm:
  - name: HAR-RV
    lib: sp500bench
    target: volatility
    note: "Corsi (2009) heterogeneous autoregressive cascade."
  - name: Log-HAR
    lib: sp500bench
    target: volatility
    note: "The benchmark most TSFMs fail to beat (Brini, 2026). Smearing
           correction applied on back-transform."
  - name: GJR-GARCH
    lib: arch
    target: volatility
    note: "GJR-GARCH(1,1), skew-t innovations. Captures the leverage effect -
           a negative return raises next-session volatility more than a positive
           return of equal size - which the HAR cascade cannot represent, since
           HAR regresses on unsigned realised variance and is blind to the sign
           of the shock. Skew-t innovations give the conditional density a fat
           left tail, so the arm does not concede the new 0.01/0.05 eval levels
           to Gaussian HAR quantiles by construction."

training:
  loss: MQLoss
  # Must be identical to `quantiles` in configs/eval.yaml, element for element.
  # An MQLoss model emits exactly the levels it was trained on, so a training
  # grid narrower than the evaluation grid would leave the seven neuralforecast
  # models unable to produce the tail levels CRPS is scored on - and CRPS
  # averaged over different grids is not comparable across models. The two
  # grids are checked for equality at load time in scripts/run_experiment.py.
  quantiles: [0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]
  hyperparameters: published_defaults
  tuning:
    enabled: true
    scope: PatchTST_only
    trials: 15
    rationale: "Compute-budget constraint, stated explicitly in Limitations."
  seed: 20260826
  deterministic: true
