[project]
name = "sp500bench"
version = "0.1.0"
description = "Three generations of forecasting models on S&P 500 daily returns"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
